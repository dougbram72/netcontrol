services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netcontrol
      POSTGRES_PASSWORD: netcontrol
      POSTGRES_DB: netcontrol
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Expose for local dev (host tools / non-docker server)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netcontrol -d netcontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://netcontrol:netcontrol@db:5432/netcontrol
      FCC_DATA_DIR: /data/fcc
    volumes:
      - fccdata:/data/fcc
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  fccdata:
